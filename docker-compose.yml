# Local dev backing services. Not used in any deployed environment.
#
# `tilt up` (see ./Tiltfile) brings this stack up and supervises the three
# TypeScript apps (@fde/api, @fde/web, @fde/workers) on top of it. Running
# `docker compose up -d` on its own brings up just the infra — handy when you
# want to run an app from your editor/debugger.
#
# Every host port is `${VAR:-default}` so a clash on your machine can be
# remapped from .env without editing this file. If you remap one, keep the
# matching URL/address in .env in sync (DATABASE_URL, TEMPORAL_ADDRESS,
# SPICEDB_ENDPOINT, REDIS_URL). Defaults here match .env.example.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fde_dev
    ports:
      - '${PG_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fde_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal dev server — the in-memory single-binary server (no
  # Cassandra/Elasticsearch), same image + command as docker-compose.e2e.yml.
  # Unlike the e2e stack this one persists to a SQLite file on a named volume
  # so workflow history survives `tilt down` / a machine restart. The volume is
  # mounted at the `temporal` user's home so it inherits that user's ownership.
  # Web UI on :8233, front-end gRPC on :7233.
  temporal:
    image: temporalio/temporal:1.8.3
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --log-level
      - warn
      - --db-filename
      - /home/temporal/temporal.db
    ports:
      - '${TEMPORAL_HOST_PORT:-7233}:7233'
      - '${TEMPORAL_UI_PORT:-8233}:8233'
    volumes:
      - temporaldata:/home/temporal
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      retries: 20

  # SpiceDB (@fde/authz). In-memory datastore, preshared key `dev`. gRPC serves
  # plaintext by default (current SpiceDB dropped the old `--grpc-no-tls` flag —
  # TLS is opt-in via `--grpc-tls-cert-path`), which matches SPICEDB_TOKEN=dev /
  # SPICEDB_INSECURE=true in .env.example. The schema is pushed separately by
  # `pnpm --filter @fde/authz schema:push` (the Tiltfile `setup` resource runs it).
  spicedb:
    image: authzed/spicedb:v1.35.0
    command: ['serve', '--grpc-preshared-key', 'dev', '--log-level', 'warn']
    ports:
      - '${SPICEDB_HOST_PORT:-50051}:50051'
    healthcheck:
      test: ['CMD', 'grpc_health_probe', '-addr=localhost:50051']
      interval: 5s
      timeout: 5s
      retries: 20

  # KMS for @fde/crypto integration tests. Off by default; bring it up with
  # `docker compose --profile aws up -d` or `tilt up -- --aws`.
  localstack:
    image: localstack/localstack:3
    profiles: ['aws']
    environment:
      SERVICES: kms
      DEBUG: '0'
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'

  # Redis — not wired into any app code yet (lands with M3). Off by default;
  # bring it up with `docker compose --profile redis up -d` or
  # `tilt up -- --redis`. REDIS_URL in .env.example points here.
  redis:
    image: redis:7-alpine
    profiles: ['redis']
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Nango (self-hosted) — OAuth token custody for `nango-oauth` connectors --
  # `docs/architecture.md`: Nango self-hosted (never Nango Cloud) — connector
  # tokens are crown-jewel access. This is a curated minimal set rather than a
  # top-level `include:` of NangoHQ's compose file, whose bind mounts
  # (`./packages/providers/providers.yaml`, `./nango-data`) assume you are inside
  # the nango repo. Off by default; bring it up with
  # `docker compose --profile nango up -d` or `tilt up -- nango`. The worker
  # (@fde/workers) talks to it via NANGO_SERVER_URL / NANGO_SECRET_KEY; without
  # those it uses FakeNangoClient and Linear runs on FakeLinearClient.
  #
  # One-time setup after first boot — create the `linear` integration
  # (providerConfigKey=`linear`) with your Linear OAuth app credentials: see
  # packages/connectors/src/nango/README.md.
  nango-db:
    image: postgres:16-alpine
    profiles: ['nango']
    environment:
      POSTGRES_USER: nango
      POSTGRES_PASSWORD: nango
      POSTGRES_DB: nango
    volumes:
      - nangodata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nango -d nango']
      interval: 5s
      timeout: 5s
      retries: 10

  nango-redis:
    image: redis:7-alpine
    profiles: ['nango']
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  nango-server:
    image: nangohq/nango-server:hosted
    platform: linux/amd64
    profiles: ['nango']
    depends_on:
      nango-db:
        condition: service_healthy
      nango-redis:
        condition: service_healthy
    environment:
      NANGO_DB_HOST: nango-db
      NANGO_DB_PORT: '5432'
      NANGO_DB_USER: nango
      NANGO_DB_PASSWORD: nango
      NANGO_DB_NAME: nango
      NANGO_REDIS_URL: redis://nango-redis:6379
      # dev-only 32-byte base64 key — generate a real one for any shared env
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY:-RVhBTVBMRV9ERVZfT05MWV8zMl9CWVRFX0tFWV9YWFhY}
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY:-nango-dev-secret-key}
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:-http://localhost:3003}
      NANGO_PUBLIC_SERVER_URL: ${NANGO_SERVER_URL:-http://localhost:3003}
      NANGO_PUBLIC_CONNECT_URL: ${NANGO_CONNECT_BASE_URL:-http://localhost:3009}
      SERVER_PORT: '3003'
      FLAG_AUTH_ENABLED: 'false'
      FLAG_SERVE_CONNECT_UI: 'true'
      NANGO_LOGS_ENABLED: 'false'
      TELEMETRY: 'false'
    ports:
      - '${NANGO_SERVER_PORT:-3003}:3003'
      - '${NANGO_CONNECT_UI_PORT:-3009}:3009'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
  temporaldata:
  nangodata:
