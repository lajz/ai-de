# Local dev services. Not used in any deployed environment.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fde_dev
    ports:
      # override with PG_HOST_PORT if 5432 is taken; keep DATABASE_URL in sync
      - '${PG_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fde_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # KMS for @fde/crypto integration tests. Start with: docker compose --profile aws up -d
  localstack:
    image: localstack/localstack:3
    profiles: ['aws']
    environment:
      SERVICES: kms
      DEBUG: '0'
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'

volumes:
  pgdata:
