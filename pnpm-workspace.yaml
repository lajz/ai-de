packages:
  - 'packages/*'
  - 'tools/*'
  # - "apps/*"   # added when the first app lands (M1)

# esbuild needs its postinstall to fetch the platform binary; tsx / vitest /
# drizzle-kit all depend on it.
onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true

catalog:
  '@types/node': ^22.10.5
  typescript: ^5.7.3
  vitest: ^2.1.8
  zod: ^3.24.1
  drizzle-orm: ^0.38.3
  drizzle-kit: ^0.30.1
  postgres: ^3.4.5
