packages:
  - 'packages/*'
  - 'tools/*'
  - 'apps/*'
  - 'e2e'

# esbuild needs its postinstall to fetch the platform binary; tsx / vitest /
# drizzle-kit all depend on it.
onlyBuiltDependencies:
  - esbuild

allowBuilds:
  # @swc/core: native binary for @temporalio/worker's workflow-code bundler.
  # protobufjs: postinstall generates its JS from .proto, needed by @temporalio/*.
  # @scarf/scarf: analytics ping pulled in transitively by @nestjs/* — no build.
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  protobufjs: true

catalog:
  '@authzed/authzed-node': 1.6.1
  langfuse: 3.38.20
  '@types/node': ^22.10.5
  typescript: ^5.7.3
  vitest: ^2.1.8
  next: ^15.5.4
  react: ^19.1.1
  react-dom: ^19.1.1
  '@types/react': ^19.1.13
  '@types/react-dom': ^19.1.9
  zod: ^3.24.1
  drizzle-orm: ^0.38.3
  drizzle-kit: ^0.30.1
  postgres: ^3.4.5
  '@temporalio/client': ^1.23.0
  '@temporalio/worker': ^1.23.0
  '@temporalio/workflow': ^1.23.0
  '@temporalio/activity': ^1.23.0
  '@temporalio/testing': ^1.23.0
  '@temporalio/common': ^1.23.0
